name: Build and release TownyTransferBridge

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Build and test
        run: mvn -B clean verify
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TownyTransferBridge-1.1.0-Paper-26.2
          path: target/TownyTransferBridge-1.1.0.jar
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.1.0
          JAR: target/TownyTransferBridge-1.1.0.jar
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" \
              --title "TownyTransferBridge 1.1.0" \
              --notes "Adds config-driven, persistent invisibility for Citizens NPC IDs, automatic reapplication on spawn/chunk load, and /townytransfer reload."
          fi
